name: macOS build
on:
  push:
    branches: [main]
    paths: ['macos/**', 'scripts/publish-macos.sh', '.github/workflows/macos.yml', 'RELEASE_NOTES.md']
  pull_request:
    paths: ['macos/**', 'scripts/publish-macos.sh', '.github/workflows/macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Universal build and scheduler self-test
        run: bash scripts/publish-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AutoConnectRush-macos
          path: |
            dist/AutoConnectRush-macos-*.zip
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AutoConnectRush-macos
          path: packages
      - name: Add Mac downloads to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.5.0 packages/* --clobber
          gh release edit v0.5.0 --title 'AutoConnectRush — Windows 0.5.0 / Mac 0.4.1 beta' --notes-file RELEASE_NOTES.md
